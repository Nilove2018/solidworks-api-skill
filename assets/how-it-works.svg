<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How the SOLIDWORKS API Skill Works">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="h_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#091222"/>
      <stop offset="100%" stop-color="#0d1b32"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="h_cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08101d" stop-opacity="0.98"/>
    </linearGradient>

    <pattern id="h_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e3a5f" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Filters -->
    <filter id="h_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="h_glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>

    <!-- Markers -->
    <marker id="h_flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="h_loopArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#h_bg)"/>
  <rect width="1200" height="400" rx="16" fill="url(#h_grid)"/>
  <rect width="1198" height="398" x="1" y="1" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Top Title Header -->
  <g transform="translate(32, 18)">
    <text x="0" y="24" class="sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.3">HOW IT WORKS : THE 5-STAGE AUTONOMOUS CAD PIPELINE</text>
    <text x="0" y="42" class="sans" font-size="12.5" fill="#94a3b8">Closed-loop AI engineering: Natural prompt to production CAD with automated self-healing verification</text>
    
    <!-- Top Right Badges -->
    <g transform="translate(850, 6)">
      <rect width="136" height="24" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="68" y="16" class="sans" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">EARLY-BOUND COM</text>

      <rect x="144" y="0" width="144" height="24" rx="12" fill="#062e1e" stroke="#059669" stroke-width="1"/>
      <text x="216" y="16" class="sans" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle">CLOSED-LOOP HEALING</text>
    </g>
  </g>

  <!-- Flow Connector Arrows (Behind cards) -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="228" y1="156" x2="258" y2="156" marker-end="url(#h_flow)"/>
    <line x1="462" y1="156" x2="492" y2="156" marker-end="url(#h_flow)"/>
    <line x1="696" y1="156" x2="726" y2="156" marker-end="url(#h_flow)"/>
    <line x1="930" y1="156" x2="960" y2="156" marker-end="url(#h_flow)"/>
  </g>

  <!-- ==================== 5 PROCESS CARDS ==================== -->
  
  <!-- CARD 1: YOU / NATURAL PROMPT -->
  <g transform="translate(24, 70)" filter="url(#h_shadow)">
    <rect width="206" height="174" rx="12" fill="url(#h_cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="206" height="5" rx="2.5" fill="#f59e0b"/>
    <!-- Icon & Header -->
    <circle cx="26" cy="25" r="12" fill="#2d1c03"/>
    <text x="26" y="29" class="sans" font-size="12" fill="#fbbf24" text-anchor="middle">P</text>
    <text x="46" y="24" class="sans" font-size="13.5" font-weight="700" fill="#ffffff">1 · User Intent</text>
    <text x="46" y="38" class="sans" font-size="10.5" fill="#f59e0b" font-weight="600">Natural Prompt (mm)</text>

    <!-- Details Box -->
    <rect x="10" y="50" width="186" height="84" rx="6" fill="#050a14" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="69" class="mono" font-size="10.5" fill="#cbd5e1">“Build an 80×50 plate”</text>
    <text x="18" y="86" class="mono" font-size="10.5" fill="#cbd5e1">“4× M5 holes at corners”</text>
    <text x="18" y="103" class="mono" font-size="10.5" fill="#cbd5e1">“Ø16 boss, 6mm thick”</text>
    <text x="18" y="120" class="mono" font-size="10" fill="#f59e0b">“Check mass &amp; volume”</text>

    <!-- Footer Tag -->
    <rect x="10" y="142" width="186" height="22" rx="11" fill="#1f1402" stroke="#b45309" stroke-width="0.8"/>
    <text x="103" y="157" class="sans" font-size="9.5" font-weight="700" fill="#fef3c7" text-anchor="middle">HUMAN REQUIREMENTS</text>
  </g>

  <!-- CARD 2: CLAUDE + SKILL -->
  <g transform="translate(258, 70)" filter="url(#h_shadow)">
    <rect width="206" height="174" rx="12" fill="url(#h_cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="206" height="5" rx="2.5" fill="#8b5cf6"/>
    <!-- Icon & Header -->
    <circle cx="26" cy="25" r="12" fill="#241442"/>
    <text x="26" y="29" class="sans" font-size="12" fill="#c084fc" text-anchor="middle">AI</text>
    <text x="46" y="24" class="sans" font-size="13.5" font-weight="700" fill="#ffffff">2 · Claude + Skill</text>
    <text x="46" y="38" class="sans" font-size="10.5" fill="#c084fc" font-weight="600">Zero-Guess Engine</text>

    <!-- Details Box -->
    <rect x="10" y="50" width="186" height="84" rx="6" fill="#050a14" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="68" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Plans feature tree order</text>
    <text x="18" y="85" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• 60+ exact API signatures</text>
    <text x="18" y="102" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• swconst enum resolver</text>
    <text x="18" y="119" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Auto unit conversion (m)</text>

    <!-- Footer Tag -->
    <rect x="10" y="142" width="186" height="22" rx="11" fill="#1e1038" stroke="#7e22ce" stroke-width="0.8"/>
    <text x="103" y="157" class="sans" font-size="9.5" font-weight="700" fill="#f3e8ff" text-anchor="middle">TYPE-LIBRARY VERIFIED</text>
  </g>

  <!-- CARD 3: PYTHON SCRIPT -->
  <g transform="translate(492, 70)" filter="url(#h_shadow)">
    <rect width="206" height="174" rx="12" fill="url(#h_cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="206" height="5" rx="2.5" fill="#0284c7"/>
    <!-- Icon & Header -->
    <circle cx="26" cy="25" r="12" fill="#0c233c"/>
    <text x="26" y="29" class="mono" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">py</text>
    <text x="46" y="24" class="sans" font-size="13.5" font-weight="700" fill="#ffffff">3 · Python swlib</text>
    <text x="46" y="38" class="sans" font-size="10.5" fill="#38bdf8" font-weight="600">Early-Bound Layer</text>

    <!-- Details Box -->
    <rect x="10" y="50" width="186" height="84" rx="6" fill="#050a14" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="68" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Model-mm coordinates</text>
    <text x="18" y="85" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Face picking by geometry</text>
    <text x="18" y="102" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Named feature hierarchy</text>
    <text x="18" y="119" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Robust COM exception trap</text>

    <!-- Footer Tag -->
    <rect x="10" y="142" width="186" height="22" rx="11" fill="#061c33" stroke="#0284c7" stroke-width="0.8"/>
    <text x="103" y="157" class="sans" font-size="9.5" font-weight="700" fill="#bae6fd" text-anchor="middle">SAFE WIN32COM DISPATCH</text>
  </g>

  <!-- CARD 4: SOLIDWORKS ENGINE -->
  <g transform="translate(726, 70)" filter="url(#h_shadow)">
    <rect width="206" height="174" rx="12" fill="url(#h_cardGrad)" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="206" height="5" rx="2.5" fill="#dc2626"/>
    <!-- Icon & Header -->
    <circle cx="26" cy="25" r="12" fill="#330d0d"/>
    <text x="26" y="29" class="sans" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">SW</text>
    <text x="46" y="24" class="sans" font-size="13.5" font-weight="700" fill="#ffffff">4 · SOLIDWORKS</text>
    <text x="46" y="38" class="sans" font-size="10.5" fill="#f87171" font-weight="600">Active CAD Session</text>

    <!-- Details Box -->
    <rect x="10" y="50" width="186" height="84" rx="6" fill="#050a14" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="68" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Live SLDWORKS.exe drive</text>
    <text x="18" y="85" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Parametric sketches &amp; cuts</text>
    <text x="18" y="102" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Boss, fillets, helix springs</text>
    <text x="18" y="119" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Skeleton mating &amp; limits</text>

    <!-- Footer Tag -->
    <rect x="10" y="142" width="186" height="22" rx="11" fill="#2a0808" stroke="#dc2626" stroke-width="0.8"/>
    <text x="103" y="157" class="sans" font-size="9.5" font-weight="700" fill="#fecaca" text-anchor="middle">SOLIDWORKS 2023–2025</text>
  </g>

  <!-- CARD 5: DELIVERABLES -->
  <g transform="translate(960, 70)" filter="url(#h_shadow)">
    <rect width="206" height="174" rx="12" fill="url(#h_cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="206" height="5" rx="2.5" fill="#10b981"/>
    <!-- Icon & Header -->
    <circle cx="26" cy="25" r="12" fill="#062e1e"/>
    <text x="26" y="29" class="mono" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">OK</text>
    <text x="46" y="24" class="sans" font-size="13.5" font-weight="700" fill="#ffffff">5 · Output Files</text>
    <text x="46" y="38" class="sans" font-size="10.5" fill="#34d399" font-weight="600">Verified Deliverables</text>

    <!-- Details Box -->
    <rect x="10" y="50" width="186" height="84" rx="6" fill="#050a14" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="68" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• .SLDPRT &amp; .SLDASM</text>
    <text x="18" y="85" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Clean .STEP / .STL / .PNG</text>
    <text x="18" y="102" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• HMAC signed credit stamp</text>
    <text x="18" y="119" class="sans" font-size="10.5" font-weight="600" fill="#e2e8f0">• Full inspection report</text>

    <!-- Footer Tag -->
    <rect x="10" y="142" width="186" height="22" rx="11" fill="#032014" stroke="#059669" stroke-width="0.8"/>
    <text x="103" y="157" class="sans" font-size="9.5" font-weight="700" fill="#d1fae5" text-anchor="middle">PRODUCTION ASSETS</text>
  </g>

  <!-- ==================== CLOSED-LOOP VERIFICATION HIGHWAY ==================== -->
  <g transform="translate(0, 258)">
    <!-- Feedback Return Path (from SW/Outputs back to Claude) -->
    <path d="M 830, -8 C 830, 36 361, 36 361, -8" fill="none" stroke="#10b981" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#h_loopArr)"/>

    <!-- Verification Dashboard Inset -->
    <g transform="translate(45, 14)" filter="url(#h_glowGreen)">
      <rect width="1110" height="106" rx="12" fill="#041a14" stroke="#10b981" stroke-width="1.6"/>
      
      <!-- Top Title of Loop -->
      <g transform="translate(20, 16)">
        <circle cx="8" cy="8" r="5" fill="#10b981">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="22" y="12.5" class="sans" font-size="12" font-weight="800" fill="#34d399" letter-spacing="1">CLOSED-LOOP VERIFICATION BUS</text>
        <text x="310" y="12.5" class="sans" font-size="11" fill="#a7f3d0">Autonomous test loop: checks model state and auto-heals failures before reporting to user</text>
      </g>

      <!-- 5 Metric Check Pills -->
      <g transform="translate(20, 36)">
        <!-- Metric 1: Volume -->
        <g transform="translate(0, 0)">
          <rect width="206" height="26" rx="6" fill="#062e22" stroke="#059669" stroke-width="1"/>
          <text x="10" y="17" class="mono" font-size="10.5" font-weight="700" fill="#6ee7b7">[PASS] Volume vs Calc</text>
          <text x="196" y="17" class="mono" font-size="10" fill="#34d399" text-anchor="end">±0.01%</text>
        </g>
        <!-- Metric 2: Bounding Box -->
        <g transform="translate(216, 0)">
          <rect width="206" height="26" rx="6" fill="#062e22" stroke="#059669" stroke-width="1"/>
          <text x="10" y="17" class="mono" font-size="10.5" font-weight="700" fill="#6ee7b7">[PASS] Bounding Box</text>
          <text x="196" y="17" class="mono" font-size="10" fill="#34d399" text-anchor="end">80×50×6</text>
        </g>
        <!-- Metric 3: What's Wrong -->
        <g transform="translate(432, 0)">
          <rect width="206" height="26" rx="6" fill="#062e22" stroke="#059669" stroke-width="1"/>
          <text x="10" y="17" class="mono" font-size="10.5" font-weight="700" fill="#6ee7b7">[PASS] What's Wrong</text>
          <text x="196" y="17" class="mono" font-size="10" fill="#34d399" text-anchor="end">= 0 Err</text>
        </g>
        <!-- Metric 4: Mates -->
        <g transform="translate(648, 0)">
          <rect width="206" height="26" rx="6" fill="#062e22" stroke="#059669" stroke-width="1"/>
          <text x="10" y="17" class="mono" font-size="10.5" font-weight="700" fill="#6ee7b7">[PASS] Mates Solved</text>
          <text x="196" y="17" class="mono" font-size="10" fill="#34d399" text-anchor="end">0 DOF</text>
        </g>
        <!-- Metric 5: Interference -->
        <g transform="translate(864, 0)">
          <rect width="206" height="26" rx="6" fill="#062e22" stroke="#059669" stroke-width="1"/>
          <text x="10" y="17" class="mono" font-size="10.5" font-weight="700" fill="#6ee7b7">[PASS] 2-Pass Clash</text>
          <text x="196" y="17" class="mono" font-size="10" fill="#34d399" text-anchor="end">0 Clash</text>
        </g>
      </g>

      <!-- Bottom Explanatory Banner -->
      <g transform="translate(20, 72)">
        <rect width="1070" height="22" rx="4" fill="#02140f" stroke="#047857" stroke-width="0.8"/>
        <text x="535" y="15" class="sans" font-size="10.5" font-weight="600" fill="#a7f3d0" text-anchor="middle">
          Self-Healing Protocol: If volume deviates, extrude inverts, or mate status is unconstrained, Claude repairs script logic automatically.
        </text>
      </g>
    </g>
  </g>
</svg>