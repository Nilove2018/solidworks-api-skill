<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="Skeleton assembly pattern">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#fbbf24"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0d2741"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#1d3a57" stroke-width="0.6"/></pattern><marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="flowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect width="1200" height="530" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="24" y="44" fill="#0f172a" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Assembly pattern: skeleton + mate recipes</text>
  <rect x="40" y="76" width="340" height="104" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="210" y="106" fill="#0f172a" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Printed / machined part</text><text x="210" y="129" fill="#475569" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">modelled in the product frame</text><rect x="52" y="142" width="316" height="26" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="0.8"/><text x="210" y="160" fill="#0284c7" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" text-anchor="middle">Front↔Front · Top↔Top · Right↔Right</text><path d="M380,128 C405.0,128 405.0,230 424,230" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#flow)"/><rect x="40" y="380" width="340" height="104" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="210" y="410" fill="#0f172a" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Sub-assembly (PCBA, vendor STEP)</text><text x="210" y="433" fill="#475569" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">own frame + named target planes</text><rect x="52" y="446" width="316" height="26" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="0.8"/><text x="210" y="464" fill="#7c3aed" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" text-anchor="middle">Front↔PL_Z_x · Right↔PL_X_x · Top↔PL_Y_x</text><path d="M380,432 C405.0,432 405.0,330 424,330" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#flow)"/><rect x="820" y="76" width="340" height="104" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="990" y="106" fill="#0f172a" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Screw / pin / insert</text><text x="990" y="129" fill="#475569" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">datums: AX + PL_SEAT</text><rect x="832" y="142" width="316" height="26" rx="6" fill="#f8fafc" stroke="#16a34a" stroke-width="0.8"/><text x="990" y="160" fill="#16a34a" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" text-anchor="middle">AX↔AX_Pn · PL_SEAT↔PL_Z_TOP · Top∥Top</text><path d="M820,128 C795.0,128 795.0,230 776,230" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#flow)"/><rect x="820" y="380" width="340" height="104" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="990" y="410" fill="#0f172a" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Spring / mechanism</text><text x="990" y="433" fill="#475569" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle">flexible sub-assembly</text><rect x="832" y="446" width="316" height="26" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="0.8"/><text x="990" y="464" fill="#dc2626" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" text-anchor="middle">limit distance mate: solid … free length</text><path d="M820,432 C795.0,432 795.0,330 776,330" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#flow)"/>
  <rect x="430" y="185" width="340" height="190" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4"/><text x="600" y="222" fill="#9a3412" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Skeleton part (fixed)</text><text x="600" y="248" fill="#7c2d12" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">only named datums at design coordinates</text><text x="600" y="282" fill="#c2410c" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="14" text-anchor="middle">PL_Z_TOP   PL_Z_SPLIT   PL_Z_BOARD</text><text x="600" y="308" fill="#c2410c" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="14" text-anchor="middle">AX_P1   AX_P2   AX_H1 … AX_Hn</text><text x="600" y="334" fill="#c2410c" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="14" text-anchor="middle">Front / Top / Right Plane</text>
  <text x="600" y="515" fill="#475569" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Place each component at its exact pose first, then mate it to the skeleton, so mates lock parts and never move them.</text>
</svg>
