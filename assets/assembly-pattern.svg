<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="Skeleton Assembly Pattern and Proven Mate Recipes">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="a_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="50%" stop-color="#091426"/>
      <stop offset="100%" stop-color="#0d1f3a"/>
    </linearGradient>

    <!-- Skeleton Centerpiece Gradient -->
    <linearGradient id="a_skelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1204"/>
      <stop offset="50%" stop-color="#1d0d03"/>
      <stop offset="100%" stop-color="#120702"/>
    </linearGradient>

    <!-- Quadrant Card Gradients -->
    <linearGradient id="a_qCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b32" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08101e" stop-opacity="0.98"/>
    </linearGradient>

    <pattern id="a_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e3a5f" stroke-width="0.5" stroke-opacity="0.45"/>
    </pattern>

    <!-- Glows and Shadows -->
    <filter id="a_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="a_skelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>

    <!-- Connectors -->
    <marker id="a_mBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="a_mPurple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b5cf6"/>
    </marker>
    <marker id="a_mGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="a_mRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="530" rx="16" fill="url(#a_bg)"/>
  <rect width="1200" height="530" rx="16" fill="url(#a_grid)"/>
  <rect width="1198" height="528" x="1" y="1" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Top Title Header -->
  <g transform="translate(36, 18)">
    <text x="0" y="24" class="sans" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="-0.3">SKELETON ASSEMBLY PATTERN &amp; PROVEN MATE RECIPES</text>
    <text x="0" y="42" class="sans" font-size="12.5" fill="#94a3b8">Deterministic constraint solving without screen coordinates · Zero mate errors · 100% fully-defined assemblies</text>
    
    <!-- Top Right Pills -->
    <g transform="translate(850, 6)">
      <rect width="140" height="24" rx="12" fill="#2d1406" stroke="#ea580c" stroke-width="1"/>
      <text x="70" y="16" class="sans" font-size="10.5" font-weight="700" fill="#fb923c" text-anchor="middle">MASTER DATUM SPINE</text>

      <rect x="148" y="0" width="134" height="24" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="215" y="16" class="sans" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">ZERO DRIFT MATING</text>
    </g>
  </g>

  <!-- ==================== BUS CONNECTOR LINES ==================== -->
  <!-- Top-Left to Skeleton -->
  <path d="M 374, 130 C 400, 130 400, 220 422, 220" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#a_mBlue)"/>
  <!-- Bottom-Left to Skeleton -->
  <path d="M 374, 396 C 400, 396 400, 320 422, 320" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a_mPurple)"/>
  <!-- Top-Right to Skeleton -->
  <path d="M 826, 130 C 800, 130 800, 220 778, 220" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#a_mGreen)"/>
  <!-- Bottom-Right to Skeleton -->
  <path d="M 826, 396 C 800, 396 800, 320 778, 320" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#a_mRed)"/>

  <!-- ==================== CENTERPIECE: SKELETON PART ==================== -->
  <g transform="translate(426, 160)" filter="url(#a_skelGlow)">
    <rect width="348" height="216" rx="14" fill="url(#a_skelGrad)" stroke="#ea580c" stroke-width="2.2"/>
    <rect width="348" height="32" rx="14" fill="#431407"/>
    <path d="M 0 18 L 0 32 L 348 32 L 348 18 z" fill="#431407"/>

    <!-- Header & Badge -->
    <circle cx="22" cy="16" r="6" fill="#ea580c"/>
    <text x="36" y="21" class="sans" font-size="14" font-weight="800" fill="#fed7aa">Skeleton.SLDPRT (Fixed at Origin)</text>

    <!-- Subtitle -->
    <text x="174" y="48" class="sans" font-size="11" font-weight="600" fill="#fdba74" text-anchor="middle">Carries NO solid bodies · Master Design Datums</text>

    <!-- Datums Box -->
    <g transform="translate(14, 56)">
      <!-- Box 1: Primary Planes -->
      <rect width="320" height="36" rx="7" fill="#180b03" stroke="#9a3412" stroke-width="1"/>
      <text x="10" y="15" class="sans" font-size="10" font-weight="700" fill="#fed7aa">PRIMARY REFERENCE PLANES (0,0,0):</text>
      <text x="10" y="29" class="mono" font-size="11" font-weight="700" fill="#fb923c">Front Plane (XY) · Top (XZ) · Right (YZ)</text>

      <!-- Box 2: Named Offset Planes -->
      <g transform="translate(0, 42)">
        <rect width="320" height="36" rx="7" fill="#180b03" stroke="#9a3412" stroke-width="1"/>
        <text x="10" y="15" class="sans" font-size="10" font-weight="700" fill="#fed7aa">NAMED OFFSET PLANES (DESIGN LEVELS):</text>
        <text x="10" y="29" class="mono" font-size="11" font-weight="700" fill="#fb923c">PL_Z_TOP · PL_Z_SPLIT · PL_Z_BOARD</text>
      </g>

      <!-- Box 3: Construction Axes -->
      <g transform="translate(0, 84)">
        <rect width="320" height="36" rx="7" fill="#180b03" stroke="#9a3412" stroke-width="1"/>
        <text x="10" y="15" class="sans" font-size="10" font-weight="700" fill="#fed7aa">CONSTRUCTION AXES (HOLE &amp; PIN CENTRES):</text>
        <text x="10" y="29" class="mono" font-size="11" font-weight="700" fill="#fb923c">AX_P1 · AX_P2 · AX_H1 ... AX_Hn</text>
      </g>
    </g>

    <!-- Bottom Indicator -->
    <rect x="24" y="190" width="300" height="16" rx="8" fill="#290f04"/>
    <text x="174" y="202" class="mono" font-size="9" font-weight="700" fill="#ffedd5" text-anchor="middle">IMMUTABLE MASTER COORDINATE FRAME</text>
  </g>

  <!-- ==================== QUADRANT 1: TOP LEFT (HOUSING) ==================== -->
  <g transform="translate(26, 68)" filter="url(#a_shadow)">
    <rect width="348" height="130" rx="12" fill="url(#a_qCardGrad)" stroke="#0284c7" stroke-width="1.6"/>
    <rect width="348" height="5" rx="2.5" fill="#0284c7"/>

    <!-- Header -->
    <circle cx="22" cy="22" r="10" fill="#0c233c"/>
    <text x="22" y="26" class="sans" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="38" y="24" class="sans" font-size="14" font-weight="700" fill="#ffffff">Printed / Machined Housing</text>
    <text x="38" y="38" class="sans" font-size="10.5" fill="#7dd3fc">Modeled directly in the product design frame</text>

    <!-- Mate Recipe Box -->
    <rect x="14" y="46" width="320" height="46" rx="6" fill="#050a14" stroke="#0284c7" stroke-width="0.8"/>
    <text x="22" y="63" class="mono" font-size="10.5" fill="#7dd3fc">Front &lt;-&gt; Front  ·  Top &lt;-&gt; Top  ·  Right &lt;-&gt; Right</text>
    <text x="22" y="81" class="sans" font-size="10" font-weight="600" fill="#38bdf8">Recipe: 3 Coincident Plane Mates (Direct Frame Match)</text>

    <!-- Footer Insight -->
    <rect x="14" y="98" width="320" height="22" rx="5" fill="#061c33"/>
    <text x="174" y="113" class="sans" font-size="9.5" font-weight="700" fill="#bae6fd" text-anchor="middle">[PASS] Instant 0 DOF Rigid Lock · No Screen Coordinates</text>
  </g>

  <!-- ==================== QUADRANT 2: BOTTOM LEFT (SUB-ASSEMBLY) ==================== -->
  <g transform="translate(26, 336)" filter="url(#a_shadow)">
    <rect width="348" height="130" rx="12" fill="url(#a_qCardGrad)" stroke="#8b5cf6" stroke-width="1.6"/>
    <rect width="348" height="5" rx="2.5" fill="#8b5cf6"/>

    <!-- Header -->
    <circle cx="22" cy="22" r="10" fill="#241442"/>
    <text x="22" y="26" class="sans" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">2</text>
    <text x="38" y="24" class="sans" font-size="14" font-weight="700" fill="#ffffff">Sub-Assembly (PCBA, COTS, Vendor)</text>
    <text x="38" y="38" class="sans" font-size="10.5" fill="#c084fc">Independent internal frame + named target datums</text>

    <!-- Mate Recipe Box -->
    <rect x="14" y="46" width="320" height="46" rx="6" fill="#050a14" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="22" y="63" class="mono" font-size="10.5" fill="#c084fc">Sub_Front &lt;-&gt; PL_Z_BOARD  ·  Right &lt;-&gt; PL_X_REF</text>
    <text x="22" y="81" class="sans" font-size="10" font-weight="600" fill="#a78bfa">Recipe: Skeleton Offset Planes (Target Datums)</text>

    <!-- Footer Insight -->
    <rect x="14" y="98" width="320" height="22" rx="5" fill="#1e1038"/>
    <text x="174" y="113" class="sans" font-size="9.5" font-weight="700" fill="#f3e8ff" text-anchor="middle">[PASS] Isolated from Vendor Revisions · Relocate via 1 Plane</text>
  </g>

  <!-- ==================== QUADRANT 3: TOP RIGHT (FASTENERS) ==================== -->
  <g transform="translate(826, 68)" filter="url(#a_shadow)">
    <rect width="348" height="130" rx="12" fill="url(#a_qCardGrad)" stroke="#10b981" stroke-width="1.6"/>
    <rect width="348" height="5" rx="2.5" fill="#10b981"/>

    <!-- Header -->
    <circle cx="22" cy="22" r="10" fill="#062e1e"/>
    <text x="22" y="26" class="sans" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">3</text>
    <text x="38" y="24" class="sans" font-size="14" font-weight="700" fill="#ffffff">Hardware / Fasteners (Screws, Pins)</text>
    <text x="38" y="38" class="sans" font-size="10.5" fill="#6ee7b7">Cylindrical axis + shoulder seating datums</text>

    <!-- Mate Recipe Box -->
    <rect x="14" y="46" width="320" height="46" rx="6" fill="#050a14" stroke="#10b981" stroke-width="0.8"/>
    <text x="22" y="63" class="mono" font-size="10" fill="#6ee7b7">Cyl_Axis &lt;-&gt; AX_Pn  ·  PL_SEAT &lt;-&gt; PL_Z_TOP  ·  Top || Top</text>
    <text x="22" y="81" class="sans" font-size="10" font-weight="600" fill="#34d399">Recipe: Concentric Axis + Coincident Seat + Parallel Lock</text>

    <!-- Footer Insight -->
    <rect x="14" y="98" width="320" height="22" rx="5" fill="#032014"/>
    <text x="174" y="113" class="sans" font-size="9.5" font-weight="700" fill="#d1fae5" text-anchor="middle">[PASS] Exact Seating Depth · Never Flips or Inverts Direction</text>
  </g>

  <!-- ==================== QUADRANT 4: BOTTOM RIGHT (MECHANISMS) ==================== -->
  <g transform="translate(826, 336)" filter="url(#a_shadow)">
    <rect width="348" height="130" rx="12" fill="url(#a_qCardGrad)" stroke="#f43f5e" stroke-width="1.6"/>
    <rect width="348" height="5" rx="2.5" fill="#f43f5e"/>

    <!-- Header -->
    <circle cx="22" cy="22" r="10" fill="#330d17"/>
    <text x="22" y="26" class="sans" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">4</text>
    <text x="38" y="24" class="sans" font-size="14" font-weight="700" fill="#ffffff">Dynamic Mechanisms &amp; Springs</text>
    <text x="38" y="38" class="sans" font-size="10.5" fill="#fda4af">Flexible sub-assemblies with kinematic range</text>

    <!-- Mate Recipe Box -->
    <rect x="14" y="46" width="320" height="46" rx="6" fill="#050a14" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="22" y="63" class="mono" font-size="10" fill="#fda4af">LimitDist: L_Solid … L_Free  ·  LimitAng: 0° … 90°</text>
    <text x="22" y="81" class="sans" font-size="10" font-weight="600" fill="#fb7185">Recipe: com_put("Solving", swComponentFlexibleSolving)</text>

    <!-- Footer Insight -->
    <rect x="14" y="98" width="320" height="22" rx="5" fill="#2a0812"/>
    <text x="174" y="113" class="sans" font-size="9.5" font-weight="700" fill="#ffe4e6" text-anchor="middle">[PASS] Articulates in Main Assembly Without Rebuild Errors</text>
  </g>

  <!-- ==================== BOTTOM GOLDEN RULE CALLOUT ==================== -->
  <g transform="translate(26, 480)">
    <rect width="1148" height="34" rx="8" fill="#0c1b32" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="574" y="21" class="sans" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">
      <tspan fill="#f59e0b">CRITICAL AXIOM:</tspan> Place each component at its exact design pose <tspan fill="#38bdf8">FIRST</tspan>, then apply mates to the Skeleton. Mates must only <tspan fill="#34d399">LOCK</tspan> degrees of freedom — never drag geometry.
    </text>
  </g>
</svg>